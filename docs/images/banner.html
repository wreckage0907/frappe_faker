<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html{zoom:2}
  body{width:1200px;height:380px;overflow:hidden;
       font-family:Inter,-apple-system,"Segoe UI",sans-serif;
       background:#12101c;position:relative;
       display:flex;flex-direction:column;align-items:center;justify-content:center}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;top:-420px;left:50%;
        transform:translateX(-50%);pointer-events:none;
        background:radial-gradient(circle,rgba(109,40,217,.38) 0%,rgba(109,40,217,0) 63%)}
  .rules{position:absolute;inset:0;pointer-events:none;
         background:repeating-linear-gradient(to bottom,transparent 0 46px,
                    rgba(196,181,253,.05) 46px 47px)}
  .fade{position:absolute;inset:0;pointer-events:none;
        background:radial-gradient(ellipse 520px 280px at 50% 46%,rgba(18,16,28,.92) 0%,rgba(18,16,28,0) 100%)}
  .row{display:flex;align-items:center;gap:26px;position:relative;z-index:2}
  .row img{width:92px;height:92px;display:block;
           filter:drop-shadow(0 12px 32px rgba(109,40,217,.55))}
  .word{font-size:60px;font-weight:700;letter-spacing:-.035em;color:#f8fafc;line-height:1}
  .tag{position:relative;z-index:2;margin-top:26px;font-size:19px;font-weight:400;
       letter-spacing:-.005em;color:#a3a0b8;text-align:center;line-height:1.5}
  .tag b{color:#c4b5fd;font-weight:500}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-weight:500;
        letter-spacing:.14em;text-transform:uppercase;color:#6b6885;
        position:relative;z-index:2;margin-top:30px}
  .strip{position:absolute;left:0;right:0;bottom:0;height:5px;
         background:linear-gradient(to right,#4c1d95 0%,#6d28d9 38%,#8b5cf6 68%,#c4b5fd 100%)}
</style></head>
<body>
  <div class="glow"></div><div class="rules"></div><div class="fade"></div>
  <div class="row"><img src="logo.svg" alt=""><div class="word">Frappe&nbsp;Faker</div></div>
  <div class="tag">Realistic, correctly-linked test data for any Frappe&nbsp;/&nbsp;ERPNext DocType.<br>
    Generated by an LLM, inserted in dependency order, <b>rolled back in one click.</b></div>
  <div class="mono">plan &middot; generate &middot; cleanup</div>
  <div class="strip"></div>
</body></html>
